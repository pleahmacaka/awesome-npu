name: Sync site from README

# README.md 가 바뀌면 index.html 을 다시 생성해 커밋한다.
# GitHub Pages 는 Settings > Pages > Source = "Deploy from a branch" (main / root)
# 로 두면 커밋된 index.html 이 그대로 서빙된다. (별도 Pages 권한 불필요)

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate index.html from README.md
        run: node scripts/generate.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: sync index.html from README.md [skip ci]"
            git push
          else
            echo "index.html already up to date — nothing to commit."
          fi
