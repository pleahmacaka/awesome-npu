name: Deploy to GitHub Pages

# README.md 를 소스로 index.html 을 생성해 GitHub Pages 로 배포한다.
# Settings > Pages > Source = "GitHub Actions" 상태에서 main push 시 자동 배포.

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'index.html'
      - 'scripts/**'
      - '.nojekyll'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 배포를 취소하지 않고 큐잉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate index.html from README.md
        run: node scripts/generate.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
